<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#080808">

  <title>Sara AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="saraApp">

    <!-- Sara Avatar -->
    <div id="avatarArea">

      <div id="avatarContainer">
        <img
          id="saraAvatar"
          src="assets/sara.png"
          alt="Sara"
        >
      </div>

      <div id="saraStatus">
        Sara ready
      </div>

    </div>


    <!-- Sara Conversation -->
    <div id="conversationArea">

      <div
        id="saraMessage"
        class="message saraMessage"
      >
        Haan, bolo 😊
      </div>

      <div
        id="userMessage"
        class="message userMessage hidden"
      >
      </div>

    </div>


    <!-- Voice -->
    <div id="voiceArea">

      <button
        id="voiceButton"
        type="button"
        aria-label="Sara se baat karein"
      >
        🎙️
      </button>

      <div id="voiceStatus">
        Baat karne ke liye tap karo
      </div>

    </div>


    <!-- Activate -->
    <div id="activateArea">

      <button
        id="activateButton"
        type="button"
      >
        ACTIVATE SARA
      </button>

    </div>

  </div>


  <!--
    Firebase yahan DIRECT nahi lagega.

    Firebase connection:
    js/firebase-config.js
    js/firebase.js

    AI:
    js/ai.js

    Voice:
    js/voice.js

    Memory:
    js/memory.js

    Personality + Mood:
    js/personality.js

    Main controller:
    js/app.js
  -->

  <script type="module" src="js/app.js"></script>

</body>
</html>
