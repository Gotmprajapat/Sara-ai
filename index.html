<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#080808">

  <title>Sara AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==============================
       LOGIN / SIGNUP
  =============================== -->

  <div id="authScreen" class="authScreen">

    <div class="authBox">

      <h1>Sara</h1>

      <p>Apni Sara se connect karo</p>

      <input
        id="emailInput"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="passwordInput"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginButton">
        LOGIN
      </button>

      <button id="signupButton">
        CREATE ACCOUNT
      </button>

      <div id="authMessage"></div>

    </div>

  </div>


  <!-- ==============================
       SARA MAIN APP
  =============================== -->

  <div id="saraApp" class="hidden">

    <!-- Avatar -->

    <div id="avatarArea">

      <div id="avatarContainer">

        <img
          id="saraAvatar"
          src="assets/sara.png"
          alt="Sara"
        >

      </div>

      <div id="saraStatus">
        Sara ready
      </div>

    </div>


    <!-- Conversation -->

    <div id="conversationArea">

      <div
        id="saraMessage"
        class="message saraMessage"
      >
        Haan, bolo 😊
      </div>

      <div
        id="userMessage"
        class="message userMessage hidden"
      ></div>

    </div>


    <!-- Voice -->

    <div id="voiceArea">

      <button
        id="voiceButton"
        type="button"
        aria-label="Sara se baat karein"
      >
        🎙️
      </button>

      <div id="voiceStatus">
        Baat karne ke liye tap karo
      </div>

    </div>


    <!-- Activate -->

    <div id="activateArea">

      <button
        id="activateButton"
        type="button"
      >
        ACTIVATE SARA
      </button>

    </div>

  </div>


  <!-- Main app -->

  <script
    type="module"
    src="js/app.js"
  ></script>

</body>

</html>
